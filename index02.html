<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Survival Backpack</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        
        /* Loading Spinner */
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #3b82f6; /* Blue-500 */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Backpack item animation */
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .item-pop {
            animation: pop 0.3s ease-out forwards;
        }

        #output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            object-fit: cover;
        }
    </style>
</head>
<body class="relative">

    <!-- Loading Overlay (z-index 9999) -->
    <div id="loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-gray-900 text-white text-center px-4">
        <div class="spinner mb-6"></div>
        <h2 class="text-2xl font-bold mb-2">กำลังโหลดระบบ AI ตรวจจับมือ และเปิดกล้อง...</h2>
        <p class="text-gray-400 text-lg">กรุณารอสักครู่ (ครั้งแรกอาจใช้เวลา 10-20 วินาที)</p>
        <p class="text-yellow-400 text-sm mt-4">* กรุณากดยืนยันการเข้าถึงกล้อง (Allow Camera) ที่แถบด้านบนของเบราว์เซอร์</p>
    </div>

    <!-- Hidden Video Element for MediaPipe -->
    <video id="input_video" class="hidden" autoplay playsinline></video>

    <!-- Fullscreen Game Canvas -->
    <canvas id="output_canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between">
        
        <!-- Header -->
        <div class="w-full flex justify-between p-4 bg-gradient-to-b from-black/80 to-transparent">
            <div class="text-blue-400 font-bold text-3xl drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] border-b-4 border-blue-500 pb-1">TEAM BLUE</div>
            <div class="bg-black/60 px-6 py-2 rounded-full text-white font-semibold flex items-center gap-2 border border-gray-500 shadow-lg backdrop-blur-sm text-lg">
                <span>🤏 จีบนิ้วเพื่อหยิบของใส่กระเป๋า!</span>
            </div>
            <div class="text-red-400 font-bold text-3xl drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] border-b-4 border-red-500 pb-1">TEAM RED</div>
        </div>

        <!-- Center Divider Line -->
        <div class="absolute left-1/2 top-0 bottom-0 w-1 bg-white/20 -translate-x-1/2 border-x border-white/10 z-[-1] border-dashed"></div>

        <!-- Backpack Inventory Panels -->
        <div class="w-full flex justify-between p-4 pb-8">
            
            <!-- Blue Team Backpack -->
            <div class="w-2/5 max-w-md bg-blue-900/80 border-2 border-blue-400 rounded-2xl p-4 shadow-[0_0_15px_rgba(59,130,246,0.5)] backdrop-blur-md pointer-events-auto">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-white font-bold text-xl">🎒 กระเป๋าทีมสีน้ำเงิน</h3>
                    <span id="blue-count" class="bg-blue-500 text-white text-lg font-bold px-4 py-1 rounded-full">0</span>
                </div>
                <div id="blue-inventory" class="flex flex-wrap gap-2 h-[100px] overflow-y-auto bg-black/50 rounded-xl p-2 border border-blue-500/50 content-start">
                    <!-- Grabbed items go here -->
                </div>
            </div>

            <!-- Red Team Backpack -->
            <div class="w-2/5 max-w-md bg-red-900/80 border-2 border-red-400 rounded-2xl p-4 shadow-[0_0_15px_rgba(239,68,68,0.5)] backdrop-blur-md pointer-events-auto">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-white font-bold text-xl">🎒 กระเป๋าทีมสีแดง</h3>
                    <span id="red-count" class="bg-red-500 text-white text-lg font-bold px-4 py-1 rounded-full">0</span>
                </div>
                <div id="red-inventory" class="flex flex-wrap gap-2 h-[100px] overflow-y-auto bg-black/50 rounded-xl p-2 border border-red-500/50 content-start">
                    <!-- Grabbed items go here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- GAME LOGIC & CONFIG ---
        // Items: Water, Medicine, Food, Mask, Baseball Bat, Flashlight
        const ITEMS = ['💧', '💊', '🍱', '😷', '🏏', '🔦'];
        const PINCH_THRESHOLD = 0.05; // Distance threshold for pinching
        const ITEM_RADIUS = 0.08; // Collision radius (normalized)

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // UI Elements
        const blueInventory = document.getElementById('blue-inventory');
        const redInventory = document.getElementById('red-inventory');
        const blueCount = document.getElementById('blue-count');
        const redCount = document.getElementById('red-count');
        const loadingScreen = document.getElementById('loading');

        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvasElement.width = canvasWidth;
            canvasElement.height = canvasHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State (Max 3 items dropping per side at a time)
        const gameState = {
            blue: {
                score: 0,
                inventory: [],
                slots: [null, null, null]
            },
            red: {
                score: 0,
                inventory: [],
                slots: [null, null, null]
            }
        };

        // Utility: Create a new dropping item
        function createItem(team, slotIndex) {
            const emoji = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            
            // X positioning based on team and slot index
            // Blue side: Left half (approx 15%, 30%, 45%)
            // Red side: Right half (approx 55%, 70%, 85%)
            let normX = team === 'blue' 
                ? 0.15 + (slotIndex * 0.15) 
                : 0.55 + (slotIndex * 0.15);

            // Add slight random offset to X so it doesn't look too rigid
            normX += (Math.random() - 0.5) * 0.05;

            return {
                emoji: emoji,
                x: normX,
                y: -0.1, // Start above the screen
                targetY: 0.2 + Math.random() * 0.5, // Fall to a random height
                speed: 0.003 + (Math.random() * 0.004),
                state: 'falling'
            };
        }

        // Initialize active slots
        for(let i=0; i<3; i++) {
            gameState.blue.slots[i] = createItem('blue', i);
            gameState.red.slots[i] = createItem('red', i);
        }

        // Update UI Inventory
        function updateInventoryUI(team) {
            const invContainer = team === 'blue' ? blueInventory : redInventory;
            const countContainer = team === 'blue' ? blueCount : redCount;
            const inventory = gameState[team].inventory;

            countContainer.innerText = gameState[team].score;

            const latestItem = inventory[inventory.length - 1];
            if (latestItem) {
                const el = document.createElement('div');
                el.className = 'w-10 h-10 flex items-center justify-center bg-white/20 rounded-lg text-2xl item-pop shadow-sm';
                el.innerText = latestItem;
                invContainer.appendChild(el);
                
                // Auto scroll to bottom
                invContainer.scrollTop = invContainer.scrollHeight;
            }
        }

        // --- MEDIAPIPE HAND TRACKING ---
        let isLoaded = false;

        function onResults(results) {
            // Hide loading screen ONLY on the first successful result frame
            if (!isLoaded) {
                loadingScreen.style.display = 'none';
                isLoaded = true;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. Draw Video Frame (Mirrored Horizontally)
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            // Restore context so text/UI elements are drawn normally (not mirrored)
            canvasCtx.restore();

            // 2. Update & Draw Items
            updateAndDrawItems('blue');
            updateAndDrawItems('red');

            // 3. Process Hands & Pinch Detection
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    
                    // We must mirror the landmark X coordinates because we mirrored the video
                    const mirroredLandmarks = landmarks.map(lm => ({
                        x: 1 - lm.x, 
                        y: lm.y,
                        z: lm.z
                    }));

                    // Draw hand skeleton (optional, helps players see tracking)
                    drawConnectors(canvasCtx, mirroredLandmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, mirroredLandmarks, {color: '#fbbf24', lineWidth: 1, radius: 3});

                    // Pinch Detection (Thumb tip = 4, Index tip = 8)
                    const thumbTip = mirroredLandmarks[4];
                    const indexTip = mirroredLandmarks[8];

                    // Calculate distance
                    const dx = thumbTip.x - indexTip.x;
                    const dy = thumbTip.y - indexTip.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < PINCH_THRESHOLD) {
                        // Pinch detected! Find midpoint
                        const midX = (thumbTip.x + indexTip.x) / 2;
                        const midY = (thumbTip.y + indexTip.y) / 2;
                        
                        // Visual feedback for pinch
                        canvasCtx.beginPath();
                        canvasCtx.arc(midX * canvasWidth, midY * canvasHeight, 25, 0, 2 * Math.PI);
                        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        canvasCtx.fill();
                        canvasCtx.lineWidth = 2;
                        canvasCtx.strokeStyle = 'yellow';
                        canvasCtx.stroke();

                        // Determine which side the pinch is on
                        const team = midX < 0.5 ? 'blue' : 'red';
                        checkGrabs(team, midX, midY);
                    }
                }
            }
        }

        function updateAndDrawItems(team) {
            const slots = gameState[team].slots;
            
            for (let i = 0; i < slots.length; i++) {
                let item = slots[i];
                if (!item) continue;
                
                // Physics: fall down until target height
                if (item.y < item.targetY) {
                    item.y += item.speed;
                } else {
                    item.state = 'resting';
                }

                // Drawing logic
                const pxX = item.x * canvasWidth;
                const pxY = item.y * canvasHeight;
                
                // Draw background circle / bubble for item
                canvasCtx.beginPath();
                canvasCtx.arc(pxX, pxY, 40, 0, 2 * Math.PI);
                canvasCtx.fillStyle = team === 'blue' 
                    ? 'rgba(30, 58, 138, 0.7)' // Darker blue bg
                    : 'rgba(153, 27, 27, 0.7)'; // Darker red bg
                canvasCtx.fill();
                
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = team === 'blue' ? '#3b82f6' : '#ef4444';
                canvasCtx.stroke();

                // Draw Emoji
                canvasCtx.font = "45px Arial";
                canvasCtx.textAlign = "center";
                canvasCtx.textBaseline = "middle";
                canvasCtx.fillText(item.emoji, pxX, pxY + 4); // +4 for vertical centering
            }
        }

        function checkGrabs(team, pinchX, pinchY) {
            const slots = gameState[team].slots;
            
            for (let i = 0; i < slots.length; i++) {
                let item = slots[i];
                if (!item) continue;
                
                // Collision Check 
                const dx = Math.abs(pinchX - item.x);
                // Compensate for aspect ratio so collision area is circular
                const aspectRatio = canvasWidth / canvasHeight; 
                const dy = Math.abs(pinchY - item.y) / aspectRatio; 
                
                if (dx < ITEM_RADIUS && dy < ITEM_RADIUS) {
                    // Item Grabbed!
                    gameState[team].score += 1;
                    gameState[team].inventory.push(item.emoji);
                    updateInventoryUI(team);

                    // Immediately spawn a new item in this slot from the top
                    gameState[team].slots[i] = createItem(team, i);
                    break; // Only grab one item per hand per frame
                }
            }
        }

        // --- INITIALIZE AI & CAMERA ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        // CRITICAL UPDATE: modelComplexity: 0 for much faster loading and performance
        hands.setOptions({
            maxNumHands: 4, 
            modelComplexity: 0,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        
        camera.start().catch(err => {
            console.error("Camera error:", err);
            loadingScreen.innerHTML = `
                <div class="text-red-500 text-5xl mb-4">❌</div>
                <h2 class="text-2xl font-bold mb-2 text-white">ไม่สามารถเปิดกล้องได้</h2>
                <p class="text-gray-300">กรุณาตรวจสอบว่ามีกล้องเชื่อมต่ออยู่ และอนุญาตให้เบราว์เซอร์เข้าถึงกล้อง (Allow Camera)</p>
                <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-blue-600 rounded-full text-white font-bold">ลองใหม่อีกครั้ง</button>
            `;
        });

    </script>
</body>
</html>
